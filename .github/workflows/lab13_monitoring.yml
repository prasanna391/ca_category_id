name: Lab 13 - E2E MLOps Pipeline Monitoring
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  mlops-monitoring:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Dependencies
      run: pip install pandas numpy scipy
    - name: Run Evolved Data Generation
      run: python src/mlops_pipeline/12_create_evolved_dataset.py
    - name: Run API Performance Metrics
      run: python src/mlops_pipeline/12_api_performance_monitoring.py
    - name: Run Performance Drift Orchestrator
      run: python src/mlops_pipeline/12_monitor_trigger.py
