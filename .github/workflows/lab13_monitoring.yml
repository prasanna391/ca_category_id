name: Lab 13 - E2E MLOps Pipeline Monitoring

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mlops-monitoring:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Runtime Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scipy scikit-learn

    - name: Run Data Evolution Lab
      run: python src/mlops_pipeline/12_create_evolved_dataset.py

    - name: Run Live API Metrics Performance Log
      run: python src/mlops_pipeline/12_api_performance_monitoring.py

    - name: Execute Drift Check and Automated Retraining Orchestrator
      run: python src/mlops_pipeline/12_monitor_trigger.py
