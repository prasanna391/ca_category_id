name: Lab 13 - MLOps Runner Testing Suite

on:
  workflow_run:
    workflows: ["Lab 13 - E2E MLOps Pipeline Monitoring"]
    types:
      - completed

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Verify Generated MLOps Artifacts
      run: |
        echo "Verifying artifact generations..."
        if [ -f "baseline_dataset.csv" ] && [ -f "production_logs.csv" ] && [ -f "updated_training_pool.csv" ]; then
          echo " All automated production dataset pipelines successfully generated artifacts!"
        else
          echo " Warning: Expected pipeline training output files are missing."
          exit 1
        fi
